# All *.toml files in the lord-kali config dir are loaded in lexicographic order.
# Rules from earlier files match first (first-match-wins priority).
# Split configs like 00-base.toml, 10-bash.toml, 20-groups.toml are supported.
#
# NOTE: the settings sections below ([log], [approval], [approval.llm], [file] enabled /
# mutation_scope, [worktree-protection], [otel]) belong in `settings.toml`, which is the
# authoritative source for them and REPLACES what the numbered files say. They are shown here
# for reference; see "Settings vs rules" in the README.

[log]
enabled = true
path = "~/.local/state/lord-kali/hook.jsonl"

# Central approval TUI (opt-in; default off). When enabled AND `lord-kali watch`
# is running, ask/pass-through calls are routed to that TUI instead of Claude
# Code's own per-terminal prompt. With no TUI running, behavior is unchanged.
# [approval]
# enabled = true
# live_rules = "99-live.toml"            # file the TUI appends allow/deny-always rules to
# state_dir = "~/.local/state/lord-kali" # queue + heartbeat live here
# Destructive commands (rm, dd, Remove-Item, …) always default to tight, path-specific
# rules in the TUI; list extra commands here to give them the same treatment.
# guardrail_commands = ["terraform", "kubectl"]
# Timers (milliseconds; omit any to keep the built-in default shown). self_timeout_ms is the
# max the blocked gate waits on the TUI before handing off to Claude Code's own prompt — keep
# it under the `timeout` you set on the hook registration (Claude Code's default is 600s). heartbeat_fresh_ms is how stale the TUI heartbeat
# may get before the gate treats it as dead and degrades to pass-through. pending_timeout_ms
# is how long `watch --tail` tracks an un-executed call before flagging it. poll_ms /
# watch_poll_ms are the gate and watch/TUI loop poll intervals.
# self_timeout_ms = 50000
# poll_ms = 200
# heartbeat_fresh_ms = 3000
# pending_timeout_ms = 60000
# watch_poll_ms = 200

# LLM auto-approval (opt-in; default off). When enabled AND `lord-kali watch` is running, a
# passthrough is sent to a safety model (only Bash/PowerShell calls — MCP and WebFetch skip it).
# The model goes FIRST: `queue_wait_ms` defaults to 0, so it answers immediately and you review
# a stated opinion during `proposal_wait_ms` rather than pre-empting one that doesn't exist yet.
# A "safe" verdict auto-applies as a TIGHT allow rule when that window elapses untouched.
# Anything else (unsafe/malformed/error) just passes through — the model never auto-denies, and
# acting on a call at any point cancels the model path. The key is read from the named env var,
# never config.
# [approval.llm]
# enabled = true
# model = "mistralai/mistral-small-3.2-24b-instruct"  # dense non-reasoning 24B; glm-4-32b (eval winner) was delisted
# api_key_env = "OPENROUTER_API_KEY"
# queue_wait_ms = 0                 # operator grace BEFORE the model; 0 = the model answers first
# proposal_wait_ms = 5000           # your window to override the model before it auto-applies
# timeout_ms = 8000                 # per-attempt
# max_attempts = 1                  # a transient failure escalates to you rather than retrying
# cache_ttl_ms = 3600000            # reuse a verdict for an identical (tool, command, cwd); 0 disables
# max_concurrent = 4                # in-flight consults; the excess queues instead of hitting rate limits
# base_url = "https://openrouter.ai/api/v1/chat/completions"
# The prompt defaults to the locked taxonomy in code; override here to tune without rebuilding.
# system = "..."
# user = "tool: {{tool}}\ncwd: {{cwd}}\ncommand: {{command}}"

# OpenTelemetry export (opt-in; default off). lord-kali is its own OTel producer with its
# own service.name and namespace — Claude Code's telemetry is separate and stays separate.
# Note Claude Code strips OTEL_* from every subprocess it spawns, hooks included, so lord-kali
# never inherits an endpoint; configure it here.
#
# The short-lived gate never exports. `lord-kali watch` tails the JSONL and emits OTLP, so a
# collector that was down loses nothing — the checkpoint resumes from the last exported record.
# [otel]
# enabled = true
# endpoint = "http://localhost:4318"      # /v1/metrics and /v1/logs are appended
# protocol = "http/json"                  # anything else is a hard error, never a silent downgrade
# headers_env = "LORD_KALI_OTEL_HEADERS"  # NAME of an env var holding `k=v,k=v`; values are never logged
# export_interval_ms = 10000
# metrics = true
# logs = true
# include_command = true                  # ships FULL command lines — see `redact` before using a remote collector
# redact = ['/[A-Za-z0-9_]*(TOKEN|SECRET|PASSWORD|KEY|PAT)=\S+/']
# service_name = "lord-kali"
# checkpoint = "~/.local/state/lord-kali/otel.checkpoint"

[bash]
allowed_commands = [
  "awk", "basename", "cat", "cut", "date", "df", "diff", "dirname",
  "base64", "cd", "du", "echo", "env", "fd", "file", "find", "free", "grep",
  "head", "htop", "id", "jq", "less", "ls", "lsof", "md5sum", "more",
  "od", "pgrep", "ping", "printenv", "printf", "ps", "pwd", "realpath", "rg",
  "sed", "sha256sum", "sort", "stat", "tail", "tee", "top", "tr", "tree",
  "true", "type", "uname", "uniq", "uptime", "wc", "whereis", "which",
  "whoami", "xargs", "xxd",
]

[[bash.rules]]
command = "cargo"
args = "{fmt,build,test}{, **}"
decision = "allow"

[[bash.rules]]
command = "git"
args = "{status,diff,log,show,branch,tag,remote,fetch,blame,shortlog,describe,rev-parse,ls-files,ls-tree,cat-file,reflog,stash list,stash show,add}{, **}"
decision = "allow"

[[bash.rules]]
command = "rm"
args = "-rf **"
decision = "deny"
reason = "No recursive force deletes"

[[bash.rules]]
command = "rm"
decision = "ask"
reason = "rm can be dangerous, please ask."

[[bash.rules]]
command = "rmdir"
decision = "ask"
reason = "rmdir can be dangerous, please ask."

[[bash.rules]]
command = "npm"
decision = "deny"
reason = "Use pnpm instead of npm."

[[bash.rules]]
command = "npx"
decision = "deny"
reason = "Use pnpm dlx instead of npx."

[[bash.rules]]
command = "pnpm"
args = "{validate,lint,run validate,run lint}{, **}"
decision = "allow"

[[bash.rules]]
command = "pnpm"
args = "{ls,why,info,view}{, **}"
decision = "allow"

[[bash.rules]]
command = "docker"
args = "logs{, **}"
decision = "allow"

# allow to fetch any URL without a query parameter
[[web-fetch.rules]]
url = "/[^?]*/"
decision = "allow"

# allow every web search (a search string carries no side effects); the key is `query`
[[web-search.rules]]
query = "**"
decision = "allow"

# MCP tool gating. Rules key on the full tool name (mcp__<server>__<tool>); glob and
# /regex/ both work. Matching is on the name only — the tool's structured arguments are
# never inspected (they are shown read-only in the approval TUI). First match wins, so a
# specific `ask`/`deny` must precede a broader `allow`.
[[mcp.rules]]
tool = "mcp__playwright__browser_fill_form"
decision = "ask"                       # eyeball form fills in the TUI even if the rest is allowed
[[mcp.rules]]
tool = "mcp__playwright__*"
decision = "allow"

# File-edit gating (opt-in; default off). When enabled, file MUTATIONS (Write/Edit/MultiEdit/
# NotebookEdit) are gated by target path, and reads (Read/Glob/Grep) are gated only when their
# path escapes cwd. Best paired with [approval] + `lord-kali watch`: unmatched calls route to
# the TUI where you can whitelist them (apply-always persists a [[file.rules]] rule, scoped via
# the `t` ladder: full path → dir → cwd subtree → **/*.ext). File calls never reach the LLM.
# [file]
# enabled = true
# mutation_scope = "all"        # "all": every mutation routes to the TUI (see and whitelist them).
#                               # "outside_cwd": only mutations whose path escapes cwd are gated.
#
# [[file.rules]]                # first-match-wins, glob or /regex/ on the resolved absolute path
# path = "**/*.cs"
# decision = "allow"
# projects = ["~/co-flo-apigateway"]

# Per-rule project scoping: restrict a rule to specific directories
#
# [[bash.rules]]
# command = "cargo"
# args = "publish{, **}"
# decision = "deny"
# projects = ["~/projects/my-rust-project"]

# Group-scoped overrides: all rules in a group inherit its projects.
# Rules within a group can add extra projects (union with group's).
#
# [[group]]
# projects = ["~/projects/my-rust-project", "~/projects/other"]
#
# [group.bash]
# allowed_commands = ["rustup"]
#
# [[group.bash.rules]]
# command = "cargo"
# args = "publish{, **}"
# decision = "deny"
# reason = "Do not publish from these projects"
#
# [[group.bash.rules]]
# command = "make"
# decision = "allow"
# projects = ["~/projects/third"]
# # effective projects = group's + ["~/projects/third"]
#
# [[group.web-fetch.rules]]
# url = "https://internal.example.com/**"
# decision = "allow"
